name: RTO frontend and database checks

on:
  pull_request:
  push:
    branches:
      - main
      - production-ready-candidate

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser JavaScript syntax
        run: node --check frontend/js/app.js
      - name: Check Netlify API function syntax
        run: node --check netlify/functions/rto-api.mjs
      - name: Check rate-limited authentication wrapper syntax
        run: node --check netlify/functions/rto-auth.mjs
      - name: Run structural smoke checks
        run: node tests/smoke-check.mjs
      - name: Run isolated server API auth tests
        run: node tests/api-smoke.mjs

  database-migration-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rto_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Test forward migrations on disposable PostgreSQL
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/rto_test
          PGPASSWORD: postgres
        run: bash tests/sql/migration-smoke.sh
      - name: Test clean-install baseline on a second disposable database
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/rto_baseline_test
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -p 5432 -U postgres rto_baseline_test
          bash tests/sql/baseline-smoke.sh
