<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReviewTapOperate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --ink:#F2F1EA; --ink-dim:#9AA0AE;
    --bg:#12141C; --surface:#1B1E29; --surface-2:#232734;
    --gold:#E8B84B; --teal:#4FD1C5; --line:rgba(242,241,234,0.09);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}
  a{color:inherit;}
  .wrap{width:100%;max-width:440px;margin:0 auto;padding:0 20px 60px;}
  .center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .brand{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:28px;}
  .brand .mark{width:34px;height:34px;border-radius:9px;background:var(--gold);color:#1a1a1a;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;}
  .brand span{font-weight:600;letter-spacing:-0.01em;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;}
  input, textarea{
    width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;color:var(--ink);font-size:14px;font-family:inherit;outline:none;margin-top:5px;
  }
  input:focus, textarea:focus{border-color:var(--gold);}
  input[type=file]{padding:8px;}
  label{font-size:12.5px;color:var(--ink-dim);font-weight:500;}
  .hint{font-size:11.5px;color:#6b7280;margin-top:4px;line-height:1.4;}
  .field{margin-bottom:16px;}
  .section-label{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--gold);opacity:0.85;margin:22px 0 12px;}
  .section-label:first-child{margin-top:0;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--gold);color:#1a1a1a;font-weight:700;font-size:14px;
    border:none;border-radius:11px;padding:12px 18px;cursor:pointer;text-decoration:none;width:100%;
  }
  .btn.secondary{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);}
  .btn-row{display:flex;gap:8px;margin-top:18px;}
  .btn-row .btn{width:auto;flex:1;}
  .row-list{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
  .row-item{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
  .row-item .info{display:flex;align-items:center;gap:10px;min-width:0;}
  .row-item .avatar{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;color:var(--gold);font-size:13px;overflow:hidden;flex-shrink:0;}
  .row-item .avatar img{width:100%;height:100%;object-fit:cover;}
  .row-item .name{font-size:14px;font-weight:600;}
  .row-item .slug{font-size:11.5px;color:var(--ink-dim);}
  .icon-btn{width:32px;height:32px;border-radius:8px;background:transparent;border:none;color:var(--ink-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;}
  .icon-btn:hover{background:var(--surface-2);color:var(--gold);}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--line);padding:11px 18px;border-radius:11px;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;}
  .toast.show{opacity:1;}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px;}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:360px;width:100%;text-align:center;}
  #qrcanvas-holder{background:#fff;border-radius:12px;padding:16px;display:flex;justify-content:center;margin:16px 0;}
  .top-bar{display:flex;align-items:center;justify-content:space-between;margin:20px 0 4px;}
  .muted{color:var(--ink-dim);font-size:13.5px;}
  .setup-warning{background:#3a2a12;border:1px solid #7c5a1f;color:#f3d9a0;border-radius:12px;padding:16px;font-size:13px;line-height:1.5;margin-bottom:20px;}

  /* Public profile */
  .cover{height:120px;background:var(--surface);border-bottom:1px solid var(--line);background-size:cover;background-position:center;}
  .hero{text-align:center;margin-top:-48px;padding-bottom:20px;}
  .avatar-lg{width:96px;height:96px;border-radius:50%;background:var(--surface);border:4px solid var(--bg);margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:32px;color:var(--gold);overflow:hidden;}
  .avatar-lg img{width:100%;height:100%;object-fit:cover;}
  .p-name{font-family:'Fraunces',serif;font-size:26px;font-weight:600;margin:0 0 4px;}
  .p-title{color:var(--ink-dim);font-size:14px;margin:0;}
  .link-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px 15px;text-decoration:none;margin-bottom:9px;}
  .link-row .li-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
  .link-row .li-label{font-size:14px;font-weight:600;}
  .link-row .li-sub{font-size:12px;color:var(--ink-dim);margin-top:1px;}
  .pay-row{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:20px;}
  .pay-row .value{font-family:monospace;font-weight:700;font-size:18px;letter-spacing:0.03em;}
  .strip{display:flex;gap:9px;overflow-x:auto;padding-bottom:6px;margin-bottom:20px;}
  .strip .pc{flex-shrink:0;width:130px;height:88px;border-radius:11px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:flex-end;padding:9px;font-size:11.5px;color:var(--ink-dim);}
  .footer-tag{text-align:center;color:#565c68;font-size:11.5px;margin-top:20px;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   1. CONFIG — fill these in after you set up Supabase.
      See SETUP.md for exact steps.
   ============================================================ */
const SUPABASE_URL = "https://ptmznpjsgdkasvywufcx.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB0bXpucGpzZ2RrYXN2eXd1ZmN4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3NDcwODIsImV4cCI6MjEwNDMyMzA4Mn0.eonbgECAHUqIRMHd-UaDRdho3FZbzj2fABFNl75npNg";
const ADMIN_PASSCODE = "RTO2026"; // change this before real use — pick something only you know

const configured = SUPABASE_URL !== "YOUR_SUPABASE_URL" && SUPABASE_ANON_KEY !== "YOUR_SUPABASE_ANON_KEY";
const sb = configured ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const app = document.getElementById("app");
const params = new URLSearchParams(window.location.search);
const slug = params.get("c");

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}
function esc(s){ return (s||"").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function digits(v){ return (v||"").replace(/[^\d+]/g,""); }
function initials(name){ return (name||"?").split(" ").filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join(""); }
function tapLink(s){ return window.location.origin + window.location.pathname + "?c=" + s; }
function slugify(v){ return v.toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"").slice(0,40); }

/* ============================================================
   ROUTING
   ============================================================ */
if (!configured) {
  renderSetupNeeded();
} else if (slug) {
  renderPublicProfile(slug);
} else {
  renderAdminGate();
}

/* ============================================================
   SETUP-NEEDED SCREEN
   ============================================================ */
function renderSetupNeeded(){
  app.innerHTML = `
    <div class="center-screen">
      <div class="wrap" style="max-width:420px;">
        <div class="brand"><div class="mark">RTO</div><span>ReviewTapOperate</span></div>
        <div class="setup-warning">
          <b>Setup needed.</b> This site isn't connected to a database yet.
          Open this file, find <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code> near the top of the &lt;script&gt;,
          and paste in your own values from Supabase. Full steps are in SETUP.md.
        </div>
      </div>
    </div>`;
}

/* ============================================================
   ADMIN — passcode gate
   ============================================================ */
function renderAdminGate(){
  if (sessionStorage.getItem("rto_admin") === "1") return renderDashboard();
  app.innerHTML = `
    <div class="center-screen">
      <div class="wrap" style="max-width:360px;">
        <div class="brand"><div class="mark">RTO</div><span>ReviewTapOperate</span></div>
        <div class="card">
          <label>Admin passcode</label>
          <input type="password" id="pass" placeholder="Enter passcode">
          <button class="btn" style="margin-top:14px;" onclick="checkPass()">Unlock</button>
        </div>
        <p class="hint" style="text-align:center;margin-top:14px;">
          Customers never see this screen. Anyone scanning a QR or tapping a card goes straight to their own page — no login, ever.
        </p>
      </div>
    </div>`;
  document.getElementById("pass").addEventListener("keydown", e => { if(e.key==="Enter") checkPass(); });
}
function checkPass(){
  const v = document.getElementById("pass").value;
  if (v === ADMIN_PASSCODE) { sessionStorage.setItem("rto_admin","1"); renderDashboard(); }
  else toast("Wrong passcode");
}

/* ============================================================
   ADMIN — dashboard
   ============================================================ */
async function renderDashboard(){
  app.innerHTML = `
    <div class="wrap">
      <div class="top-bar">
        <div class="brand" style="margin:0;"><div class="mark">RTO</div><span>ReviewTapOperate</span></div>
      </div>
      <p class="muted" style="margin:0 0 18px;">Every customer's tap card, one dashboard.</p>
      <div class="btn-row" style="margin-top:0;">
        <button class="btn" onclick="showForm()">+ New customer</button>
      </div>
      <div id="formHolder"></div>
      <div id="listHolder" class="row-list"><p class="muted">Loading customers…</p></div>
    </div>`;
  loadCustomerList();
}

async function loadCustomerList(){
  const holder = document.getElementById("listHolder");
  const { data, error } = await sb.from("customers").select("*").order("created_at",{ascending:false});
  if (error) { holder.innerHTML = `<p class="muted">Couldn't load customers: ${esc(error.message)}</p>`; return; }
  if (!data.length) { holder.innerHTML = `<p class="muted">No customers yet — add your first one above.</p>`; return; }
  holder.innerHTML = data.map(c => `
    <div class="row-item">
      <div class="info">
        <div class="avatar">${c.photo_url ? `<img src="${esc(c.photo_url)}">` : initials(c.name)}</div>
        <div>
          <div class="name">${esc(c.name)}</div>
          <div class="slug">?c=${esc(c.slug)}</div>
        </div>
      </div>
      <div style="display:flex;gap:2px;">
        <button class="icon-btn" title="Preview" onclick="window.open(tapLink('${c.slug}'),'_blank')">&#128065;</button>
        <button class="icon-btn" title="Copy link" onclick="copyLink('${c.slug}')">&#128279;</button>
        <button class="icon-btn" title="QR code" onclick="showQr('${c.slug}','${esc(c.name).replace(/'/g,"\\'")}')">&#9642;</button>
        <button class="icon-btn" title="Delete" onclick="deleteCustomer('${c.slug}')">&#128465;</button>
      </div>
    </div>
  `).join("");
}
function copyLink(s){ navigator.clipboard.writeText(tapLink(s)); toast("Tap link copied"); }
async function deleteCustomer(s){
  if (!confirm("Delete this customer's page? This can't be undone.")) return;
  const { error } = await sb.from("customers").delete().eq("slug", s);
  if (error) toast("Couldn't delete: " + error.message);
  else { toast("Deleted"); loadCustomerList(); }
}

/* ---- New/edit customer form ---- */
function showForm(){
  document.getElementById("formHolder").innerHTML = `
    <div class="card" style="margin:16px 0;">
      <p style="font-weight:600;margin:0 0 4px;">New customer profile</p>
      <p class="hint" style="margin-bottom:16px;">Anything left blank just won't show up on their page. Only name and Link ID are required.</p>

      <div class="section-label">Basic info</div>
      <div class="field"><label>Full name</label><input id="f_name" oninput="autoSlug()"></div>
      <div class="field"><label>Link ID (in URL)</label><input id="f_slug"><div class="hint">Auto-fills from the name. Letters, numbers, dashes only — this becomes their tap link.</div></div>
      <div class="field"><label>Title / business</label><input id="f_title" placeholder='e.g. "Founder, Bright Salon"'></div>

      <div class="section-label">Save Contact button</div>
      <div class="field"><label>Phone number</label><input id="f_phone" placeholder="+2547XXXXXXXX"><div class="hint">Saved straight into the visitor's phone contacts. Leave blank to hide this button.</div></div>

      <div class="section-label">Connect buttons</div>
      <div class="field"><label>WhatsApp number</label><input id="f_wa" placeholder="+2547XXXXXXXX"></div>
      <div class="field"><label>WhatsApp opening message</label><input id="f_wamsg" value="Hi, I got your tap card!"></div>
      <div class="field"><label>Google review link</label><input id="f_review" placeholder="https://g.page/r/.../review"><div class="hint">Google Business Profile → "Ask for reviews" → copy link.</div></div>
      <div class="field"><label>Instagram handle</label><input id="f_ig" placeholder="yourhandle (no @)"></div>
      <div class="field"><label>LinkedIn handle</label><input id="f_li" placeholder="yourhandle"></div>

      <div class="section-label">Payment</div>
      <div class="field"><label>Till / Paybill number</label><input id="f_till"></div>
      <div class="field"><label>Label above it</label><input id="f_tillLabel" value="M-Pesa Till Number"></div>

      <div class="section-label">Portfolio (up to 3)</div>
      <div class="field"><input id="f_p1" placeholder="Portfolio item 1"></div>
      <div class="field"><input id="f_p2" placeholder="Portfolio item 2"></div>
      <div class="field"><input id="f_p3" placeholder="Portfolio item 3"></div>

      <div class="section-label">Appearance</div>
      <div class="field">
        <label>Profile photo</label>
        <input type="file" id="f_photo" accept="image/*">
        <div class="hint">Choose straight from your phone or computer — this uploads the real file, no links needed.</div>
      </div>
      <div class="field">
        <label>Background / cover photo</label>
        <input type="file" id="f_bg" accept="image/*">
      </div>

      <div class="btn-row">
        <button class="btn" id="saveBtn" onclick="saveCustomer()">Save & publish</button>
        <button class="btn secondary" onclick="document.getElementById('formHolder').innerHTML=''">Cancel</button>
      </div>
    </div>`;
}
let slugTouched = false;
function autoSlug(){
  if (slugTouched) return;
  document.getElementById("f_slug").value = slugify(document.getElementById("f_name").value);
}
document.addEventListener("input", e => { if (e.target && e.target.id === "f_slug") slugTouched = true; });

async function uploadImage(fileInputId, slugValue, tag){
  const input = document.getElementById(fileInputId);
  const file = input.files[0];
  if (!file) return null;
  const path = `${slugValue}/${tag}-${Date.now()}-${file.name}`;
  const { error } = await sb.storage.from("rto-photos").upload(path, file, { upsert:true });
  if (error) { toast("Photo upload failed: " + error.message); return null; }
  const { data } = sb.storage.from("rto-photos").getPublicUrl(path);
  return data.publicUrl;
}

async function saveCustomer(){
  const name = document.getElementById("f_name").value.trim();
  const slugValue = slugify(document.getElementById("f_slug").value);
  if (!name || !slugValue) { toast("Name and Link ID are required"); return; }

  const btn = document.getElementById("saveBtn");
  btn.textContent = "Saving…"; btn.disabled = true;

  const photoUrl = await uploadImage("f_photo", slugValue, "photo");
  const bgUrl = await uploadImage("f_bg", slugValue, "bg");

  const record = {
    slug: slugValue,
    name,
    title: document.getElementById("f_title").value.trim(),
    phone: document.getElementById("f_phone").value.trim(),
    whatsapp_number: document.getElementById("f_wa").value.trim(),
    whatsapp_message: document.getElementById("f_wamsg").value.trim(),
    google_review_url: document.getElementById("f_review").value.trim(),
    instagram: document.getElementById("f_ig").value.trim(),
    linkedin: document.getElementById("f_li").value.trim(),
    till_number: document.getElementById("f_till").value.trim(),
    till_label: document.getElementById("f_tillLabel").value.trim(),
    portfolio: [document.getElementById("f_p1").value, document.getElementById("f_p2").value, document.getElementById("f_p3").value].filter(Boolean),
  };
  if (photoUrl) record.photo_url = photoUrl;
  if (bgUrl) record.background_url = bgUrl;

  const { error } = await sb.from("customers").upsert(record, { onConflict: "slug" });
  btn.textContent = "Save & publish"; btn.disabled = false;

  if (error) { toast("Couldn't save: " + error.message); return; }
  toast(`Saved — ${name}'s page is live`);
  document.getElementById("formHolder").innerHTML = "";
  slugTouched = false;
  loadCustomerList();
  showQr(slugValue, name);
}

/* ---- QR modal ---- */
function showQr(slugValue, name){
  const link = tapLink(slugValue);
  document.body.insertAdjacentHTML("beforeend", `
    <div class="modal-bg" id="qrModal" onclick="if(event.target.id==='qrModal') closeQr()">
      <div class="modal">
        <p style="font-weight:600;margin:0;">${esc(name)}'s QR code</p>
        <p class="hint">Print this or scan it directly to test.</p>
        <div id="qrcanvas-holder"></div>
        <button class="btn" id="dlBtn">Download QR</button>
        <p class="hint" style="margin-top:12px;">This link: <br><span style="color:var(--gold);word-break:break-all;">${esc(link)}</span></p>
        <button class="btn secondary" style="margin-top:12px;" onclick="closeQr()">Close</button>
      </div>
    </div>`);
  const holder = document.getElementById("qrcanvas-holder");
  new QRCode(holder, { text: link, width: 240, height: 240, colorDark:"#12141C", colorLight:"#ffffff" });
  setTimeout(() => {
    const canvas = holder.querySelector("canvas");
    document.getElementById("dlBtn").onclick = () => {
      const a = document.createElement("a");
      a.href = canvas.toDataURL("image/png");
      a.download = `${slugValue}-qr.png`;
      a.click();
    };
  }, 150);
}
function closeQr(){ const m = document.getElementById("qrModal"); if (m) m.remove(); }

/* ============================================================
   PUBLIC TAP PAGE — no login, guest access only
   ============================================================ */
async function renderPublicProfile(s){
  app.innerHTML = `<div class="center-screen"><p class="muted">Loading…</p></div>`;
  const { data, error } = await sb.from("customers").select("*").eq("slug", s).maybeSingle();
  if (error || !data) {
    app.innerHTML = `<div class="center-screen"><div style="text-align:center;"><p style="font-weight:600;">Profile not found</p><p class="muted">This tap link isn't set up yet.</p></div></div>`;
    return;
  }
  const c = data;
  app.innerHTML = `
    <div class="cover" style="${c.background_url ? `background-image:url('${esc(c.background_url)}')` : ""}"></div>
    <div class="wrap">
      <div class="hero">
        <div class="avatar-lg">${c.photo_url ? `<img src="${esc(c.photo_url)}">` : initials(c.name)}</div>
        <h1 class="p-name">${esc(c.name)}</h1>
        ${c.title ? `<p class="p-title">${esc(c.title)}</p>` : ""}
        ${c.phone ? `<a class="btn" style="margin-top:22px;" download="${esc(c.name)}.vcf" href="${vcard(c)}">Save my contact</a>` : ""}
      </div>

      ${(c.whatsapp_number || c.google_review_url || c.instagram || c.linkedin) ? `
        <div class="section-label" style="color:var(--ink-dim);">Connect</div>
        ${c.whatsapp_number ? linkRow(`https://wa.me/${digits(c.whatsapp_number)}?text=${encodeURIComponent(c.whatsapp_message||"Hi!")}`,"rgba(79,209,197,.15)","var(--teal)","&#128172;","Chat on WhatsApp","Send a message directly") : ""}
        ${c.google_review_url ? linkRow(c.google_review_url,"rgba(232,184,75,.15)","var(--gold)","&#9733;","Leave a Google review","Takes 30 seconds") : ""}
        ${c.instagram ? linkRow(`https://instagram.com/${c.instagram.replace("@","")}`,"var(--surface-2)","var(--ink)","&#9711;","Instagram","@"+esc(c.instagram.replace("@",""))) : ""}
        ${c.linkedin ? linkRow(`https://linkedin.com/in/${c.linkedin}`,"var(--surface-2)","var(--ink)","in","LinkedIn","Connect professionally") : ""}
      ` : ""}

      ${c.till_number ? `
        <div class="section-label" style="color:var(--ink-dim);">Pay</div>
        <div class="pay-row">
          <div><div class="hint" style="margin:0;">${esc(c.till_label||"Till Number")}</div><div class="value">${esc(c.till_number)}</div></div>
          <button class="btn secondary" style="width:auto;padding:9px 14px;" onclick="navigator.clipboard.writeText('${esc(c.till_number)}');toast('Copied')">Copy</button>
        </div>` : ""}

      ${(c.portfolio && c.portfolio.length) ? `
        <div class="section-label" style="color:var(--ink-dim);">Recent work</div>
        <div class="strip">${c.portfolio.map(p => `<div class="pc">${esc(p)}</div>`).join("")}</div>
      ` : ""}

      <p class="footer-tag">Powered by ReviewTapOperate</p>
    </div>`;
}
function linkRow(href,bg,fg,icon,label,sub){
  return `<a class="link-row" href="${href}" target="_blank" rel="noreferrer">
    <div class="li-icon" style="background:${bg};color:${fg};">${icon}</div>
    <div><div class="li-label">${label}</div><div class="li-sub">${esc(sub)}</div></div>
  </a>`;
}
function vcard(c){
  const lines = ["BEGIN:VCARD","VERSION:3.0",`N:${c.name};;;;`,`FN:${c.name}`,
    c.title?`TITLE:${c.title}`:"", c.phone?`TEL;TYPE=CELL:${c.phone}`:"","END:VCARD"].filter(Boolean);
  return "data:text/vcard;charset=utf-8," + encodeURIComponent(lines.join("\n"));
}
</script>
